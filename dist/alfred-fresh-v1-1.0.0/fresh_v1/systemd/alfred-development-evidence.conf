[Service]
# Reuse the existing root oneshot/timer, after its original evidence publisher.
ExecStartPost=/usr/bin/python3 -I -B -c 'import sys; sys.path.insert(0,"/usr/local/lib/alfred-fresh-v1"); from fresh_v1.host import main; main()'
ProtectHome=read-only
ReadWritePaths=/var/lib/alfred-v1-handoffs /var/lib/alfred-development-state /var/lib/alfred-development-worktrees
ReadWritePaths=/home/alfred/Alfred/gateway /home/alfred/Alfred/completion-delivery
ReadWritePaths=/home/alfred/alfred-development-lab/milestone2/task-a/live-acceptance/repo/.git
ReadWritePaths=-/home/alfred/.codex -/var/lib/alfredqa/.codex -/var/lib/alfred-reviewer-home/.codex
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
TimeoutStartSec=3600
