[Service]
Environment=PYTHONPATH=/home/alfred/Git/alfred/src:/opt/alfred-developer-v1:/usr/local/lib/alfred-fresh-v1
# The existing evidence service has no CAP_DAC_OVERRIDE. Give UID 0 only
# the socket permission it needs; SO_PEERCRED still enforces root-only ops.
ExecStartPre=/usr/bin/setfacl -d -m u:root:rw- /run/alfred-development-intake
