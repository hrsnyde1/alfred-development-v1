[Service]
# Alfred OS (user alfredos) may pass through the runtime directory to reach
# owner-approval.sock. The Intake sets that socket's own ACL to exactly its owner
# and alfredos (trusted_intake_development.py _restrict_socket); intake.sock keeps
# its existing entries.
ExecStartPre=/usr/bin/setfacl -m u:alfredos:--x /run/alfred-development-intake
